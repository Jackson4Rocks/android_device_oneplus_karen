name: Build LineageOS 23.2 A16 for karen (OnePlus Nord 2T)

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Perform a clean build (make clobber before building)'
        type: boolean
        default: false
      sync_source:
        description: 'Sync LineageOS source before building'
        type: boolean
        default: true

jobs:
  build:
    name: Build ROM
    runs-on: [self-hosted, linux, x64, lineageos-build]
    timeout-minutes: 720
    env:
      # Build configuration
      LINEAGE_VERSION: "23.2"
      DEVICE: "karen"
      VENDOR: "oneplus"
      # Performance tuning
      USE_CCACHE: "1"
      CCACHE_DIR: "/mnt/ccache"
      CCACHE_MAXSIZE: "100G"
      # Java/Build options
      JAVA_HOME: "/usr/lib/jvm/java-21-openjdk"
      ANDROID_JACK_VM_ARGS: "-Xmx8g -Dfile.encoding=UTF-8 -XX:+TieredCompilation"

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/oneplus/karen
          fetch-depth: 0

      - name: Display system information
        run: |
          echo "=== System Information ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk space: $(df -h / | awk 'NR==2 {print $4}')"
          echo "Java version: $(java -version 2>&1 | head -1)"
          echo "Python version: $(python3 --version)"
          echo "Repo version: $(repo version 2>/dev/null || echo 'not installed')"
          echo "CCACHE dir: $CCACHE_DIR"
          ls -la $CCACHE_DIR 2>/dev/null || echo "CCACHE dir not found"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig openjdk-21-jdk-headless python3 python3-pip \
            rsync schedtool libssl-dev lzop pngcrush libxml2 libxml2-utils \
            liblz4-tool libprotoc-dev protobuf-compiler brotli android-sdk-libsparse-utils \
            2>&1 | tail -20

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          echo "~/bin" >> $GITHUB_PATH

      - name: Initialize LineageOS source
        if: inputs.sync_source
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs --depth=1
          echo "Initialized LineageOS 23.2 source"

      - name: Create local manifest
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cat > ~/android/lineage/.repo/local_manifests/karen.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<manifest>
  <!-- Device Tree -->
  <project path="device/oneplus/karen" name="Jackson4Rocks/android_device_oneplus_karen" remote="github" revision="lineage-23.2" />

  <!-- Common Device Tree (mt6893) - NOTE: No lineage-23.2 branch exists yet, using lineage-22.2 -->
  <project path="device/oplus/mt6893-common" name="mt6893-development/android_device_oplus_mt6893-common" remote="github" revision="lineage-22.2" />

  <!-- Kernel -->
  <project path="kernel/oneplus/karen" name="mt6893-development/android_kernel_oplus_mt6893" remote="github" revision="lineage-23.2" />
  <project path="kernel/oplus/mt6893" name="mt6893-development/android_kernel_oplus_mt6893" remote="github" revision="lineage-23.2" />

  <!-- Vendor Blobs -->
  <!-- Common vendor blobs - NOTE: No lineage-23.2 branch exists yet, using lineage-22.2 -->
  <project path="vendor/oplus/mt6893-common" name="mt6893-development/proprietary_vendor_oplus_mt6893-common" remote="github" revision="lineage-22.2" />
  <project path="vendor/oplus/op6893" name="mt6893-development/proprietary_vendor_oplus_op6893" remote="github" revision="lineage-23.2" />

  <!-- Hardware HALs -->
  <project path="hardware/mediatek" name="LineageOS/android_hardware_mediatek" remote="github" revision="lineage-23.2" />
  <project path="hardware/oplus" name="LineageOS/android_hardware_oplus" remote="github" revision="lineage-23.2" />

  <!-- SEPolicy -->
  <project path="device/mediatek/sepolicy_vndr" name="LineageOS/android_device_mediatek_sepolicy_vndr" remote="github" revision="lineage-23.2" />
</manifest>
EOF
          cat ~/android/lineage/.repo/local_manifests/karen.xml

      - name: Sync LineageOS source
        if: inputs.sync_source
        run: |
          cd ~/android/lineage
          repo sync -j$(nproc) --current-branch --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync 2>&1 | tail -50

      - name: Setup ccache
        run: |
          mkdir -p $CCACHE_DIR
          ccache -M $CCACHE_MAXSIZE
          ccache -s

      - name: Extract proprietary blobs (if vendor not present)
        run: |
          cd ~/android/lineage
          if [ ! -d "vendor/oplus" ]; then
            echo "Vendor blobs not found - attempting to extract from device tree..."
            cd device/oneplus/karen
            ./extract-files.sh 2>&1 | tail -30 || echo "Extract failed - vendor blobs must be pre-populated"
          else
            echo "Vendor directory already exists, skipping extraction"
          fi

      - name: Prepare build environment
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          echo "Build environment ready"

      - name: Configure device
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          breakfast karen
          echo "Device configured: karen"

      - name: Clean build (if requested)
        if: inputs.clean_build
        run: |
          cd ~/android/lineage
          make clobber
          echo "Clean build completed"

      - name: Build LineageOS for karen
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          export BUILD_USERNAME="github-actions"
          export BUILD_HOSTNAME="self-hosted-runner"
          croot
          brunch karen 2>&1 | tee build.log
          echo "Build completed successfully"

      - name: Find build artifacts
        run: |
          cd ~/android/lineage
          echo "=== Build Artifacts ==="
          find out/target/product/karen -name "*.zip" -type f -exec ls -lh {} \;
          find out/target/product/karen -name "*.json" -type f -exec ls -lh {} \;
          find out/target/product/karen -name "recovery.img" -type f -exec ls -lh {} \;
          find out/target/product/karen -name "dtbo.img" -type f -exec ls -lh {} \;
          find out/target/product/karen -name "boot.img" -type f -exec ls -lh {} \;
          find out/target/product/karen -name "vbmeta.img" -type f -exec ls -lh {} \;

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-23.2-karen-${{ github.run_number }}
          path: |
            ~/android/lineage/out/target/product/karen/lineage-*.zip
            ~/android/lineage/out/target/product/karen/lineage-*.json
          retention-days: 30

      - name: Upload recovery and boot images
        uses: actions/upload-artifact@v4
        with:
          name: lineage-23.2-karen-images-${{ github.run_number }}
          path: |
            ~/android/lineage/out/target/product/karen/recovery.img
            ~/android/lineage/out/target/product/karen/boot.img
            ~/android/lineage/out/target/product/karen/dtbo.img
            ~/android/lineage/out/target/product/karen/vbmeta.img
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: ~/android/lineage/build.log
          retention-days: 7

      - name: Display ccache statistics
        if: always()
        run: |
          ccache -s

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Device:** OnePlus Nord 2T (karen)" >> $GITHUB_STEP_SUMMARY
          echo "**LineageOS Version:** 23.2 (Android 16)" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ~/android/lineage/out/target/product/karen/lineage-*.zip ]; then
            ZIP_FILE=$(ls ~/android/lineage/out/target/product/karen/lineage-*.zip | head -1)
            echo "**ROM:** \`$(basename $ZIP_FILE)\`" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(ls -lh $ZIP_FILE | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          else
            echo "**ROM:** Build failed or artifact not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** This build uses `lineage-22.2` branches for common device tree and common vendor blobs because `lineage-23.2` branches don't exist yet in upstream repositories. This may cause build failures or runtime issues." >> $GITHUB_STEP_SUMMARY

  # Notify on failure
  notify_failure:
    name: Notify on Failure
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed for karen (LineageOS 23.2)"
          echo "Check the Actions tab for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
